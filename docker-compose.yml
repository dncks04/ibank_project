# ibank 로컬 실행 환경: PostgreSQL + 애플리케이션 + 모니터링(Prometheus·Grafana)
# 사용:  docker compose up --build      (앱 http://localhost:8080, Grafana http://localhost:3000)
#        docker compose down            (-v 추가 시 DB 볼륨까지 삭제)
# 앱의 관리 포트(8081, actuator/prometheus)는 호스트에 공개하지 않는다 —
# 내부 네트워크의 Prometheus만 스크랩한다(메트릭 외부 노출 차단).
services:
  db:
    image: postgres:16-alpine
    container_name: ibank-db
    environment:
      POSTGRES_DB: ibank_db
      POSTGRES_USER: ibank_user
      POSTGRES_PASSWORD: ibank_pass
    ports:
      - "5432:5432"
    volumes:
      - ibank-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibank_user -d ibank_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ibank-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: ibank-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 기본 프로파일 + DB 호스트만 컨테이너 네트워크(db)로 오버라이드.
      # Flyway가 기동 시 스키마를 자동 생성한다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ibank_db
      SPRING_DATASOURCE_USERNAME: ibank_user
      SPRING_DATASOURCE_PASSWORD: ibank_pass
      # Redis: 분산 rate limit + 인증 캐시 무효화 전파
      IBANK_REDIS_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      # FDS 서비스 연동. 기본은 FDS 서비스 없이 ibank만 띄우는 always-approve.
      # 팀 환경에서는 .env에 FDS_MODE=http, FDS_BASE_URL=http://<fds 호스트>:<포트> 를 넣는다.
      IBANK_FDS_MODE: ${FDS_MODE:-always-approve}
      IBANK_FDS_BASE_URL: ${FDS_BASE_URL:-}
      IBANK_FDS_API_TOKEN: ${FDS_API_TOKEN:-}
      # 판정 대기 거래 복구, 홀드 만료, Outbox 정리 스케줄러 (ShedLock으로 인스턴스 간 중복 실행 차단)
      IBANK_FDS_RECOVERY_ENABLED: "true"
      IBANK_HOLDS_EXPIRY_ENABLED: "true"
      IBANK_OUTBOX_CLEANUP_ENABLED: "true"
      # 키 이름에 '-'가 들어가는 맵 설정(내부 API 클라이언트, 직원 계정)은 환경변수 이름으로 표현이 안 돼 JSON으로 넘긴다.
      #   fds-service : FDS 서비스가 POST /internal/auth/token 에 보낼 클라이언트 ID와 시크릿
      #   teller01    : 창구 직원 계정 (회원가입 API로는 직원 계정을 만들 수 없다)
      # JWT 서명 키(JWT_PRIVATE_KEY)를 주지 않으면 기동할 때마다 임시 키를 만든다. 로컬 전용.
      SPRING_APPLICATION_JSON: >-
        {"ibank":{"internal":{"clients":{"fds-service":"${FDS_SERVICE_CLIENT_SECRET:-local-fds-secret}"}},
        "bootstrap":{"staff":{"teller01":{"password":"${TELLER_PASSWORD:-teller-pass-1234}","role":"ROLE_TELLER","name":"창구직원"}}}}}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      # actuator는 관리 포트(8081)로 이동 — 헬스체크도 컨테이너 내부에서 8081을 본다
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: ibank-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.0.1
    container_name: ibank-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  ibank-pgdata:

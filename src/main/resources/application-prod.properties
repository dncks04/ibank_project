# 운영(prod) 프로파일 — 민감 설정은 기본값 없이 환경변수로만 주입한다.
# 환경변수가 없으면 플레이스홀더 해석 실패로 애플리케이션이 기동에 실패한다(fail-fast).

# ===== JWT =====
# 서명용 RSA 개인키(PKCS#8 PEM). 없으면 기동에 실패한다 — 임시 키로 뜨면 재기동마다 토큰이 무효가 되고
# 인스턴스마다 키가 달라진다.
jwt.private-key=${JWT_PRIVATE_KEY}

# ===== 내부 API (서비스 간 호출) =====
# FDS 서비스가 시스템 토큰을 발급받을 때 쓰는 시크릿. 비어 있으면 FDS 서비스는 토큰을 받지 못한다.
ibank.internal.clients.fds-service=${FDS_SERVICE_CLIENT_SECRET:}

# ===== PII 보호 =====
pii.secret=${PII_SECRET}

# ===== DataSource =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 운영에서는 actuator health 상세를 노출하지 않음
management.endpoint.health.show-details=never

# ===== OpenAPI =====
# 운영에서는 API 문서(스펙·Swagger UI)를 노출하지 않는다
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===== Redis =====
# 운영 기본: Redis 사용(분산 rate limit + 인증 캐시 무효화 전파). 단일 인스턴스면 false로 끌 수 있다.
ibank.redis.enabled=${REDIS_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=${REDIS_ENABLED:true}

# ===== FDS 판정 서비스 =====
# 운영 기본: FDS 서비스를 호출한다. FDS_BASE_URL이 없으면 기동에 실패한다(판정 없이 모든 거래가 승인되는 사고 방지).
# FDS 서비스 없이 띄워야 하면 FDS_MODE=always-approve 로 명시한다.
ibank.fds.mode=${FDS_MODE:http}
ibank.fds.base-url=${FDS_BASE_URL:}
ibank.fds.api-token=${FDS_API_TOKEN:}
ibank.fds.recovery.enabled=true

# ===== 거래 이벤트 Outbox =====
ibank.outbox.cleanup.enabled=true

# ===== 호출 제한(Rate limit) =====
# 운영에서는 IP 단위 호출 제한을 활성화한다. 한도는 환경변수로 조정 가능.
ibank.rate-limit.enabled=true
ibank.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
ibank.rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:100}
ibank.rate-limit.refill-period=${RATE_LIMIT_REFILL_PERIOD:1m}

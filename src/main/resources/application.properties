spring.application.name=ibank_project

# ===== DataSource =====
spring.datasource.url=jdbc:postgresql://localhost:5432/ibank_db
spring.datasource.username=ibank_user
spring.datasource.password=ibank_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.isolation=2

# ===== JWT =====
# 운영에서는 환경변수로 주입 (JWT_SECRET)
jwt.secret=${JWT_SECRET:change-this-secret-key-in-production-min-32chars!!}
jwt.expiration-ms=86400000

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

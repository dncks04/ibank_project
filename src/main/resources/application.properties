spring.application.name=ibank_project

# ===== DataSource =====
spring.datasource.url=jdbc:postgresql://localhost:5432/ibank_db
spring.datasource.username=ibank_user
spring.datasource.password=ibank_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
# Flyway가 스키마를 관리하므로 ddl-auto=validate (Hibernate가 엔티티와 DB 스키마 일치 검증)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.isolation=2

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# ===== JWT =====
# 개발/테스트 기본값. 운영(prod 프로파일)에서는 application-prod.properties가
# JWT_SECRET 환경변수를 강제하여 미설정 시 기동에 실패한다.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-in-prod-min32!!}
# access: 15분(짧게), refresh: 14일
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=1209600000

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ===== Spring Batch =====
# 메타데이터 스키마는 Flyway(V7)가 관리
spring.batch.jdbc.initialize-schema=never
# 기동 시 잡 자동 실행 안 함 (스케줄러 또는 수동 트리거)
spring.batch.job.enabled=false

# 운영(prod) 프로파일 — 민감 설정은 기본값 없이 환경변수로만 주입한다.
# 환경변수가 없으면 플레이스홀더 해석 실패로 애플리케이션이 기동에 실패한다(fail-fast).

# ===== JWT =====
jwt.secret=${JWT_SECRET}

# ===== PII 보호 =====
pii.secret=${PII_SECRET}

# ===== DataSource =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 운영에서는 actuator health 상세를 노출하지 않음
management.endpoint.health.show-details=never

# ===== OpenAPI =====
# 운영에서는 API 문서(스펙·Swagger UI)를 노출하지 않는다
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===== Redis =====
# 운영 기본: Redis 사용(분산 rate limit + 인증 캐시 무효화 전파). 단일 인스턴스면 false로 끌 수 있다.
ibank.redis.enabled=${REDIS_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=${REDIS_ENABLED:true}

# ===== 호출 제한(Rate limit) =====
# 운영에서는 IP 단위 호출 제한을 활성화한다. 한도는 환경변수로 조정 가능.
ibank.rate-limit.enabled=true
ibank.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
ibank.rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:100}
ibank.rate-limit.refill-period=${RATE_LIMIT_REFILL_PERIOD:1m}

spring.application.name=ibank_project

# ===== DataSource =====
spring.datasource.url=jdbc:postgresql://localhost:5432/ibank_db
spring.datasource.username=ibank_user
spring.datasource.password=ibank_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
# Flyway가 스키마를 관리하므로 ddl-auto=validate (Hibernate가 엔티티와 DB 스키마 일치 검증)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.isolation=2

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# ===== JWT =====
jwt.secret=${JWT_SECRET:change-this-secret-key-in-production-min-32chars!!}
jwt.expiration-ms=86400000

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ibank 로컬 실행 환경: PostgreSQL + 애플리케이션
# 사용:  docker compose up --build      (앱은 http://localhost:8080)
#        docker compose down            (-v 추가 시 DB 볼륨까지 삭제)
services:
  db:
    image: postgres:16-alpine
    container_name: ibank-db
    environment:
      POSTGRES_DB: ibank_db
      POSTGRES_USER: ibank_user
      POSTGRES_PASSWORD: ibank_pass
    ports:
      - "5432:5432"
    volumes:
      - ibank-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibank_user -d ibank_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: ibank-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 기본 프로파일 + DB 호스트만 컨테이너 네트워크(db)로 오버라이드.
      # Flyway가 기동 시 스키마를 자동 생성한다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ibank_db
      SPRING_DATASOURCE_USERNAME: ibank_user
      SPRING_DATASOURCE_PASSWORD: ibank_pass
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  ibank-pgdata:
